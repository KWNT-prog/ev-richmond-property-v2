kind = "web"
previewPath = "/"
title = "EV Richmond Property Group"
version = "1.0.0"
id = "artifacts/richmond-property"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23935

[services.development]
run = "pnpm --filter @workspace/richmond-property run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/richmond-property", "run", "build" ]
publicDir = "artifacts/richmond-property/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23935"
BASE_PATH = "/"
